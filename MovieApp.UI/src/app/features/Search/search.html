<div class="search-container">
  <div class="header">
    <h1>Search Movies</h1>
    <p>Find your favorite movies by title, year, or genre.</p>
  </div>

  <div class="search-box shadow">
    <div class="search-panel-head">
      <h2 class="search-panel-title">Search filters</h2>
      <p class="search-panel-sub">Use one or more fields—leave the rest open for broader results.</p>
    </div>

    <form (ngSubmit)="onSearch()" #searchForm="ngForm">
      <div class="form-row form-row--title-year">
        <div class="form-field">
          <label class="field-label" for="title">Title</label>
          <input
            class="field-input"
            type="text"
            id="title"
            name="title"
            [(ngModel)]="searchTitle"
            placeholder="Full title as stored (exact match)"
            autocomplete="off"
            aria-describedby="title-search-hint">
        </div>

        <div class="form-field form-field--year">
          <label class="field-label" for="year">Release year</label>
          <input
            class="field-input"
            type="number"
            id="year"
            name="year"
            [(ngModel)]="searchYear"
            placeholder="e.g. 1993"
            min="1900"
            max="2100">
        </div>
      </div>
      <p id="title-search-hint" class="field-hint field-hint-below-row">Title match is exact (case-insensitive), not partial.</p>

      <div class="form-section">
        <label class="field-label">Genre</label>
        <p class="field-hint">Pick a genre or leave &ldquo;Any&rdquo; for all genres.</p>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="genre" [(ngModel)]="searchGenre" value=""> Any
          </label>
          <label *ngFor="let genre of availableGenres" class="radio-label">
            <input type="radio" name="genre" [(ngModel)]="searchGenre" [value]="genre"> {{ genre }}
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="clearSearch()">Clear</button>
        <button type="submit" class="btn btn-primary">Search movies</button>
      </div>
    </form>
  </div>

</div>
